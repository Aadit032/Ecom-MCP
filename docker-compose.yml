services:
  postgres:
    image: postgres:16-alpine
    container_name: ecom-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom_mcp
    ports:
      - "5432:5432"
    volumes:
      - ecom_mcp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom_mcp"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  ecom_mcp_pgdata:
